<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <title>[[*pagetitle]] — {{BRAND}}</title>
  <meta name="description" content="[[*description]]">
  <link rel="canonical" href="[[~[[*id]]]]">
</head>
<body>
  [[$Header]]
  [[$Breadcrumbs]]

  <article class="case-detail">
    <header class="case-detail__head">
      <p class="case-detail__meta">[[*industry]] · [[*growth_metric]]</p>
      <h1>[[*pagetitle]]</h1>
    </header>

    <section class="case-block case-block--was">
      <h2>Було</h2>
      [[*was_tv]]
    </section>

    <section class="case-block case-block--problem">
      <h2>Проблема</h2>
      [[*problem_tv]]
    </section>

    <section class="case-block case-block--solution">
      <h2>Рішення</h2>
      [[*solution_tv]]
    </section>

    <section class="case-block case-block--result">
      <h2>Результат</h2>
      [[*result_tv]]
    </section>

    <section class="case-block case-block--lessons">
      <h2>Уроки</h2>
      [[*lessons_tv]]
    </section>

    [[$CtaBrief? &cta_text=`Хочете такий же результат — почніть з калькулятора`]]
  </article>

  [[$Footer]]
</body>
</html>
