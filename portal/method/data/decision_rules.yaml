meta:
  version: '1.0'
  scale:
    impact: 1–10, вклад в деньги при закрытии разрыва
    difficulty: 1–10, стоимость и сложность реализации
    days: медианный срок, календарных дней
    roi: impact / difficulty
    effort_days: человеко-дней консультанта на закрытие правила
  note: impact, difficulty и days — стартовые значения по типу домена. Калибруются по факту через XX-01.
    effort_days — стартовая оценка трудоёмкости, подлежит калибровке по факту.
